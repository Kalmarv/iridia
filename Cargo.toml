[workspace]
resolver = "3"
members = ["iridia", "iridia-d3d9", "iridia-dxbc", "iridia-dxil", "iridia-exec", "iridia-interface", "iridia-mojo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/iridia"
publish = true

[workspace.dependencies]
dxbc-reader = { version = "0.1.1", git = "https://github.com/Kalmarv/dx", rev = "ee5dce9e8d52ccdf54864245ecca2cc0ee8a53bf" }
dxcontainer = { version = "0.1.1", git = "https://github.com/Kalmarv/dx", rev = "ee5dce9e8d52ccdf54864245ecca2cc0ee8a53bf" }
dxil-reader = { version = "0.1.1", git = "https://github.com/Kalmarv/dx", rev = "ee5dce9e8d52ccdf54864245ecca2cc0ee8a53bf" }
half = { version = "=2.7.1", default-features = false }
iridia = { version = "0.1.0", path = "iridia" }
iridia-dxbc = { path = "iridia-dxbc" }
iridia-dxil = { path = "iridia-dxil" }
iridia-exec = { path = "iridia-exec" }
iridia-interface = { version = "0.1.0", path = "iridia-interface" }
naga = { version = "30.0.1", package = "primase-naga", git = "https://github.com/Kalmarv/primase-naga", rev = "8e6519c3eac6f08519c61c40cb6516ea95f6dde9", default-features = false, features = ["wgsl-out"] }
primase-foundations = { version = "0.2.0", git = "https://github.com/Kalmarv/primase-foundations", rev = "b3a3d4b3a892b8342fda081ab4449bb57052a2f8" }
primase-testdata = { version = "0.1.0", git = "https://github.com/Kalmarv/primase-testdata", rev = "d0258530ca9ca0ca74e957716ae8683e7facc8a7" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
sha2 = { version = "=0.11.1", default-features = false }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
