[package]
name = "iridia"
description = "Compiled Direct3D shaders as naga modules: the program type the iridia readers produce, with validation, a WGSL writer and analyses"
readme = "README.md"
keywords = ["dxbc", "wgsl", "spirv", "shader", "decompiler"]
categories = ["graphics", "compilers", "game-development"]
documentation = "https://docs.rs/iridia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
iridia-interface.workspace = true
thiserror.workspace = true
naga.workspace = true
sha2.workspace = true

[dev-dependencies]
# The lifters, to run each fixture of tests/flow.rs through both bytecodes (a dev-dependency cycle cargo allows).
iridia-dxbc.workspace = true
iridia-dxil.workspace = true
# naga's WGSL front end, to read a writer's text back (tests/wgsl_for.rs)
naga = { workspace = true, features = ["wgsl-in", "spv-out"] }

[lints]
workspace = true
